<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6d365" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <title>Wangzai</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai:wght@400;700&display=swap" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式" title="切换亮暗主题">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <section class="stage" aria-label="旺仔动画舞台">
        <div class="canvas-wrap">
          <canvas id="petCanvas" width="384" height="416" aria-label="旺仔动画"></canvas>
        </div>
        <div class="ground-scene" aria-hidden="true">
          <div class="grass"></div>
          <div class="ground"></div>
        </div>
        <p class="status" id="statusLabel" aria-live="polite">待机中</p>
      </section>

      <section class="controls" aria-label="动作">
        <div class="btn-group btn-group--main">
          <button class="action primary" data-state="idle">待机</button>
          <button class="action primary" data-state="running">工作中</button>
        </div>
        <div class="btn-group btn-group--secondary">
          <button class="action" data-state="waiting">等待</button>
          <button class="action" data-state="review">审阅</button>
          <button class="action" data-state="waving">挥手</button>
        </div>
        <div class="btn-group btn-group--movement">
          <button class="action" data-state="jumping">跳跃</button>
          <button class="action" data-state="running
