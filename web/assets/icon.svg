    <circle cx="32" cy="-72" r="4" fill="#fff"/>
    <!-- Mouth -->
    <path d="M-18,-40 Q0,-28 18,-40" fill="none" stroke="#221f1a" stroke-width="5" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="-50" cy="-45" rx="14" ry="8" fill="#ffb4a8" opacity="0.6"/>
    <ellipse cx="50" cy="-45" rx="14" ry="8" fill="#ffb4a8" opacity="0.6"/>
    <!-- Crown / tuft -->
