<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#e94f37"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <g transform="translate(256,270)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="90" ry="100" fill="#fff9ef" stroke="#221f1a" stroke-width="6"/>
    <!-- Head -->
    <circle cx="0" cy="-60" r="80" fill="#fff9ef" stroke="#221f1a" stroke-width="6"/>
    <!-- Eyes -->
    <ellipse cx="-28" cy="-68" rx="10" ry="12" fill="#221f1a"/>
